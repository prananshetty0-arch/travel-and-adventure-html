        <h2>Registration Form for Users</h2>
    </center>
<center>
    <form action="login.html">

        Name:
        <input type="text" name="name" required  pattern="[A-z,a-z]+">

        <br><br>

        Email:
        <input type="email" name="email" required>

        <br><br>

     Phone:
<input type="tel"
       name="phone"
       minlength="10"
       maxlength="10"
       required>

        <br><br>

        Address:
        <input type="text" name="address" required>

        <br><br>

        Username:
        <input type="text" name="username" required pattern="[A-z,a-z]+">

        <br><br>

        Password:
        <input type="password" name="password" required>

        <br><br>

        <input type="submit" value="Register">

        <input type="reset" value="Reset">

    </form>
